## ClusterIP

apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
spec:
  type: ClusterIP
  selector:   
    app: nginx
  ports: 
  - port: 80
    targetPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: nginx-svc-nodeport
spec:
  type: NodePort
  selector:   
    app: nginx
  ports: 
  - port: 80
    targetPort: 80
    nodePort: 30002

---


apiVersion: v1
kind: Service
metadata:
  name: nginx-service

spec:
  type: LoadBalancer

  selector:
    app: nginx

  ports:
  - port: 80
    targetPort: 80